# ==========================================
# Configuración General del Microservicio
# ==========================================
spring.application.name=ms-reservations
server.port=8081

# ==========================================
# Azure AD (Spring Cloud Azure)
# ==========================================
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=5b6ffac2-680a-49ee-b8eb-12609107e903
spring.cloud.azure.active-directory.app-id-uri=api://5b6ffac2-680a-49ee-b8eb-12609107e903
# Reemplaza con el Tenant ID de tu App Registration en Azure AD
spring.cloud.azure.active-directory.profile.tenant-id=c46750c7-b258-426e-9333-5640bb4ecc6e

# JWT validation for tokens forwarded by the BFF
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://a1c2bfc6-a6aa-4f55-8d5d-0f493a955062.ciamlogin.com/a1c2bfc6-a6aa-4f55-8d5d-0f493a955062/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://a1c2bfc6-a6aa-4f55-8d5d-0f493a955062.ciamlogin.com/a1c2bfc6-a6aa-4f55-8d5d-0f493a955062/discovery/v2.0/keys

# ==========================================
# Base de Datos Oracle
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/andesstay_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Mensajería Asíncrona (RabbitMQ)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# Configuración de Publisher Confirms (RabbitMQ)
# ==========================================
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ==========================================
# Event Streaming (Kafka)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}



# ==========================================
# Downstream Microservices
# ==========================================
downstream.catalog.base-url=${DOWNSTREAM_CATALOG_BASE_URL:http://ms-catalog:8082}




#FLyway 
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=flyway_schema_history_reservations

# Le indica a Hibernate que solo valide las tablas contra las entidades, sin alterarlas
spring.jpa.hibernate.ddl-auto=validate

