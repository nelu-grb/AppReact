# ==========================================
# Configuración General del Microservicio
# ==========================================
spring.application.name=ms-reservations
server.port=8081
spring.cloud.azure.active-directory.enabled=false

# JWT validation for tokens forwarded by the BFF
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://a1c2bfc6-a6aa-4f55-8d5d-0f493a955062.ciamlogin.com/a1c2bfc6-a6aa-4f55-8d5d-0f493a955062/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://a1c2bfc6-a6aa-4f55-8d5d-0f493a955062.ciamlogin.com/a1c2bfc6-a6aa-4f55-8d5d-0f493a955062/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.audience=api://3576de9b-8f84-48c4-b112-5a793bc04abc

# ==========================================
# Base de Datos Oracle
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/andesstay_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Mensajería Asíncrona (RabbitMQ)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ topology
app.rabbitmq.exchange.direct=cmd.direct
app.rabbitmq.exchange.topic=evt.topic
app.rabbitmq.exchange.dlx=cmd.dead.dlx
app.rabbitmq.queue.housekeeping=q.housekeeper
app.rabbitmq.queue.voucher=q.voucher
app.rabbitmq.queue.email=q.email
app.rabbitmq.queue.housekeeping.dlq=q.housekeeper.dlq
app.rabbitmq.queue.voucher.dlq=q.voucher.dlq
app.rabbitmq.queue.email.dlq=q.email.dlq
app.rabbitmq.routing.commands.housekeeping=housekeeping.ticket
app.rabbitmq.routing.commands.voucher=voucher.gen
app.rabbitmq.routing.notifications.binding=notification.#
app.rabbitmq.routing.notifications.email=notification.email
app.rabbitmq.queue.max-length=10000
app.rabbitmq.queue.message-ttl-ms=86400000
app.rabbitmq.queue.overflow=reject-publish-dlx
app.rabbitmq.queue.dlq.max-length=10000
app.rabbitmq.queue.dlq.message-ttl-ms=2592000000

# ==========================================
# Configuración de Publisher Confirms (RabbitMQ)
# ==========================================
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ==========================================
# Event Streaming (Kafka)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}



# ==========================================
# Downstream Microservices
# ==========================================
downstream.catalog.base-url=http://localhost:8082

transbank.return-url=http://localhost:8080/payments/return
