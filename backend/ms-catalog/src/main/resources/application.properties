# ==========================================
# Configuración General del Microservicio
# ==========================================
spring.application.name=ms-catalog
server.port=8082
spring.cloud.azure.active-directory.enabled=false

# Validate the same API access tokens accepted by the BFF.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://a1c2bfc6-a6aa-4f55-8d5d-0f493a955062.ciamlogin.com/a1c2bfc6-a6aa-4f55-8d5d-0f493a955062/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://a1c2bfc6-a6aa-4f55-8d5d-0f493a955062.ciamlogin.com/a1c2bfc6-a6aa-4f55-8d5d-0f493a955062/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.audience=api://3576de9b-8f84-48c4-b112-5a793bc04abc

# ==========================================
# Base de Datos PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/andesstay_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Mensajería Asíncrona (RabbitMQ)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# Event Streaming (Kafka)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer



