# ==========================================
# Configuración General del Microservicio
# ==========================================
spring.application.name=backend
spring.main.web-application-type=servlet
server.port=8081

# ==========================================
# Azure AD & OAuth2 Resource Server
# ==========================================
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=5b6ffac2-680a-49ee-b8eb-12609107e903
spring.cloud.azure.active-directory.app-id-uri=api://5b6ffac2-680a-49ee-b8eb-12609107e903
spring.cloud.azure.active-directory.profile.tenant-id=c46750c7-b258-426e-9333-5640bb4ecc6e

# Emisor para autoconfigurar JwtDecoder
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/c46750c7-b258-426e-9333-5640bb4ecc6e/v2.0

# ==========================================
# Base de Datos PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/andesstay_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# Mensajería Asíncrona (RabbitMQ)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.queue.email=q.cmd.email
app.rabbitmq.queue.housekeeping=q.cmd.housekeeping
app.rabbitmq.queue.voucher=q.cmd.voucher

# ==========================================
# Event Streaming (Kafka)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

     
#  docker compose up --build <- para prender los servicios de backend, postgres, rabbitmq y kafka (esto incluye microservicios)
#  docker compose down <- para apagar los servicios de backend, postgres, rabbitmq y kafka (esto incluye microservicios)


