spring.application.name=msnofity
server.port=8084

# ==========================================
# Configuración de RabbitMQ
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# Acks Manuales y Prefetch
# ==========================================
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==========================================
# Queues
# ==========================================
app.rabbitmq.queue.housekeeping=q.housekeeper
app.rabbitmq.queue.voucher=q.voucher
app.rabbitmq.queue.email=q.email
app.rabbitmq.queue.housekeeping.dlq=q.housekeeper.dlq
app.rabbitmq.queue.voucher.dlq=q.voucher.dlq
app.rabbitmq.queue.email.dlq=q.email.dlq
app.rabbitmq.exchange.direct=cmd.direct
app.rabbitmq.exchange.topic=evt.topic
app.rabbitmq.exchange.dlx=cmd.dead.dlx
app.rabbitmq.routing.commands.housekeeping=housekeeping.ticket
app.rabbitmq.routing.commands.voucher=voucher.gen
app.rabbitmq.routing.notifications.binding=notification.#
app.rabbitmq.routing.notifications.email=notification.email
app.rabbitmq.queue.max-length=10000
app.rabbitmq.queue.message-ttl-ms=86400000
app.rabbitmq.queue.overflow=reject-publish-dlx
app.rabbitmq.queue.dlq.max-length=10000
app.rabbitmq.queue.dlq.message-ttl-ms=2592000000

# Reintentos transitorios antes de enviar el mensaje a su DLQ
app.rabbitmq.listener.retry.max-attempts=3
app.rabbitmq.listener.retry.initial-interval-ms=250
app.rabbitmq.listener.retry.max-interval-ms=2000

# ==========================================
# Servicio de Email
# ==========================================
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}