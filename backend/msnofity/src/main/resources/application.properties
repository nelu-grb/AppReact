spring.application.name=msnofity
server.port=8084

# ==========================================
# Configuración de RabbitMQ
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# Acks Manuales y Prefetch
# ==========================================
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==========================================
# Queues
# ==========================================
app.rabbitmq.queue.email=q.cmd.email
app.rabbitmq.queue.housekeeping=q.cmd.housekeeping
app.rabbitmq.queue.voucher=q.cmd.voucher
app.rabbitmq.queue.email-dlq=q.cmd.email.dlq
app.rabbitmq.queue.housekeeping-dlq=q.cmd.housekeeping.dlq
app.rabbitmq.queue.voucher-dlq=q.cmd.voucher.dlq
app.rabbitmq.queue.evt-notify=q.evt.notify

# ==========================================
# Exchanges
# ==========================================
# direct = comandos (routing key exacta) | topic = eventos (patrones) | dlx = mensajes muertos
app.rabbitmq.exchange.direct=cmd.direct
app.rabbitmq.exchange.events=evt.topic
app.rabbitmq.exchange.dlx=cmd.dead.dlx

# ==========================================
# Routing keys y bindings
# ==========================================
app.rabbitmq.routing.email=email.send
app.rabbitmq.routing.housekeeping=housekeeping.ticket
app.rabbitmq.routing.voucher=voucher.gen
# Patrones del topic: '*' = exactamente una palabra, '#' = cero o mas palabras
app.rabbitmq.routing.events-notify=reservation.*
app.rabbitmq.routing.events-monitor=#

# ==========================================
# Politicas de retencion y limpieza
# ==========================================
# Colas de comandos: 10 min de vida y maximo 1000 mensajes. Al vencer o desbordar -> DLQ
app.rabbitmq.retention.queue-message-ttl-ms=600000
app.rabbitmq.retention.queue-max-length=1000
# DLQ: 7 dias y maximo 1000. Al vencer o desbordar el mensaje se descarta (la DLQ no tiene DLX)
app.rabbitmq.retention.dlq-message-ttl-ms=604800000
app.rabbitmq.retention.dlq-max-length=1000
# Cola de eventos: 5 min y maximo 1000
app.rabbitmq.retention.events-message-ttl-ms=300000
app.rabbitmq.retention.events-max-length=1000

# ==========================================
# Reintentos acotados (solo errores recuperables)
# ==========================================
app.rabbitmq.retry.max-attempts=3
app.rabbitmq.retry.initial-interval-ms=1000
app.rabbitmq.retry.multiplier=2.0
app.rabbitmq.retry.max-interval-ms=10000

# ==========================================
# Consumidor de las DLQ (registra en logs y confirma)
# ==========================================
# false = los mensajes se acumulan en la DLQ (util para mostrar la metrica en el Management UI)
app.rabbitmq.dlq.listener.enabled=true

# ==========================================
# Servicio de Email
# ==========================================
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.base-url=${RESEND_BASE_URL:https://api.resend.com}