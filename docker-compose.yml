services:
  postgres-db:
    image: postgres:15-alpine
    container_name: andesstay-postgres
    restart: always
    environment:
      POSTGRES_DB: andesstay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d andesstay_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  ms-catalog:
    build:
      context: ./backend/ms-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  ms-reservations:
    build:
      context: ./backend/ms-reservations
      dockerfile: Dockerfile
    container_name: ms-reservations
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      NOTIFICATIONS_EMAIL_ENABLED: "false"
      DOWNSTREAM_CATALOG_BASE_URL: http://ms-catalog:8082
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started

  ms-bff:
    build:
      context: ./backend/ms-bff
      dockerfile: Dockerfile
    container_name: ms-bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy
      ms-catalog:
        condition: service_started
      ms-reservations:
        condition: service_started

  msaudit:
    build:
      context: ./backend/msaudit
    container_name: msaudit
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: andesstay_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_HOST: kafka:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started

  msnofity:
    build:
      context: ./backend/msnofity
    container_name: msnofity
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    depends_on:
      rabbitmq:
        condition: service_started

  msreport:
    build:
      context: ./backend/msreport
    container_name: msreport
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: andesstay_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_HOST: kafka:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  postgres_data: