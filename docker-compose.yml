services:
  postgres-db:
    image: postgres:15-alpine
    container_name: andesstay-postgres
    restart: always
    environment:
      POSTGRES_DB: andesstay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/ms-catalog/src/main/resources/init.sql:/docker-entrypoint-initdb.d/01-init-catalog.sql
      - ./backend/ms-reservations/src/main/resources/init-reservations.sql:/docker-entrypoint-initdb.d/02-init-reservations.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d andesstay_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-catalog:
    build:
      context: ./backend/ms-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-rabbit1:5672,rabbit2:5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-andesstay}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
      - messaging

  ms-reservations:
    build:
      context: ./backend/ms-reservations
      dockerfile: Dockerfile
    container_name: ms-reservations
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-rabbit1:5672,rabbit2:5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-andesstay}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      NOTIFICATIONS_EMAIL_ENABLED: "${NOTIFICATIONS_EMAIL_ENABLED:-false}"
      DOWNSTREAM_CATALOG_BASE_URL: http://ms-catalog:8082    
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
      - messaging

  ms-bff:
    build:
      context: ./backend/ms-bff
      dockerfile: Dockerfile
    container_name: ms-bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/andesstay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy
      ms-catalog:
        condition: service_started
      ms-reservations:
        condition: service_started

  msaudit:
    build:
      context: ./backend/msaudit
    container_name: msaudit
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: andesstay_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_HOST: kafka:29092
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
      - messaging

  msnofity:
    build:
      context: ./backend/msnofity
    container_name: msnofity
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-rabbit1:5672,rabbit2:5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-andesstay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    depends_on:
      ms-reservations:
        condition: service_started
    networks:
      - default
      - messaging

  msreport:
    build:
      context: ./backend/msreport
    container_name: msreport
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: andesstay_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_HOST: kafka:29092
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
      - messaging

volumes:
  postgres_data:

networks:
  messaging:
    name: andesstay-messaging
    external: true